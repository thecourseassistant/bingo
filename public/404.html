<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Classroom Bingo</title>
    <script>
      // Single Page App redirect for GitHub Pages
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body style="background-color: #020617; color: #ffffff; font-family: system-ui, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh;">
    <p>Redirecting to Classroom Bingo...</p>
  </body>
</html>
